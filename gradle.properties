# -Xmx4G + 固定 metaspace：reobfJar 重映射是内存密集型
#
# ★ 这里刻意【不】设置 -Dfile.encoding=UTF-8：
#   Gradle 写 @argfile（长类路径会走这条路）用的是守护进程的默认字符集，
#   而 JDK 17 的 java 启动器按平台默认字符集（中文 Windows = GBK）读取 @argfile。
#   一旦两者不一致，本项目路径（D:\mod\拼音搜索）与用户目录（C:\Users\联想）里的中文
#   就会在 argfile 里变成乱码 → 测试 worker 报
#   "ClassNotFoundException: worker.org.gradle.process.internal.worker.GradleWorkerMain"。
#   源码编码由 build.gradle 里的 options.encoding = 'UTF-8' 单独保证，不依赖这里。
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

minecraft_version=1.20.1
forge_version=47.3.0
mappings_channel=official
mappings_version=1.20.1

mod_id=pinyin_search
mod_name=Pinyin Search API
mod_version=1.1.4
