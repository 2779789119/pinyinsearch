name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # 打包用的 gradlew 在 Windows 上生成，可能没有可执行位
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # build = compileJava + test + jar（§8.1 的用例都是纯 JUnit，不依赖 MC 客户端）
      # 产物：主 jar + -sources.jar + -javadoc.jar（后两者供 JitPack / IDE 悬停用）
      - name: Build and test
        run: ./gradlew build --console=plain --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: pinyin_search-jars
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

  # API 文档：单独产出一份 HTML（离线可看），并准备发布到 GitHub Pages
  javadoc:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build javadoc
        run: ./gradlew javadoc --console=plain --stacktrace

      - name: Upload javadoc artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinyin_search-javadoc
          path: build/docs/javadoc
          if-no-files-found: error

      # 供 deploy-pages 使用（产物名必须叫 github-pages，由该 action 自动指定）
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/javadoc

  # 默认分支上的构建把 javadoc 发布到 GitHub Pages
  # （仓库 Settings → Pages → Source 需选 "GitHub Actions"）
  deploy-pages:
    needs: javadoc
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # v* tag → GitHub Release（JitPack 按 tag 取坐标时也能看到产物）
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          name: pinyin_search-jars
          path: libs

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: libs/*.jar
          generate_release_notes: true
