buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = "${mod_version}"
// ★ group 不能写死：JitPack 调用构建时会传 -Pgroup=com.github.2779789119
//   （它的对外坐标固定是 com.github.<user>:<repo>:<tag>）。
//   这里写死会把 -P 直接覆盖掉，产物发到别的 groupId 下，JitPack 就收不到，
//   构建日志末尾只会留一句 "No build artifacts found"。
//   -P 没传时（本地构建）project.group 是空串，回退到项目自身的 group。
group = project.group ?: 'com.pinyinsearch'
archivesBaseName = "pinyin_search-${minecraft_version}"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: "${mappings_channel}", version: "${mappings_version}"

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        server {
            args '--nogui'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // ★ 不引入 PinIn 依赖：PinIn 源码已 vendor 进 src/main/java（包名已重定位）
    // ★ 不需要 Shadow / relocation 插件
    // ★ 不引入 fastutil 依赖：直接复用 MC 自带的 fastutil（版本比对见 README）

    // 纯 JUnit 表驱动测试（匹配逻辑不依赖 MC 运行时，CI 里也能跑）
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

// ============================================================
// mods.toml 版本号注入（只替换 mod_version，中文作者名直接写在 toml 里）
// ============================================================
tasks.named('processResources', ProcessResources).configure {
    // mods.toml 是 UTF-8 且含中文（作者名）；显式指定过滤字符集，避免跟随平台默认字符集
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            mod_version: mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : "pinyin_search authors",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "pinyin_search authors",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

// ============================================================
// API 文档（给依赖方看）
//   * sources / javadoc 附加产物：JitPack 会一并发布，依赖方在 IDE 里悬停
//     API 时能直接看到完整中文 JavaDoc（含 §4 要求的参数/返回/null/线程/异常说明）
//   * javadoc 任务：只对 api 包（+ 模组入口）出文档 —— 与文档 §4「api 包是唯一对外稳定面」一致，
//     vendored 的 PinIn 与 impl 包不对外承诺兼容性，不发布文档
// ============================================================
java {
    withSourcesJar()
    withJavadocJar()
}

// ============================================================
// 发布（依赖方通过 JitPack 坐标 com.github.2779789119:pinyinsearch:<tag> 获取）
//   * maven-publish 插件只提供任务，不会自动决定「发布什么」—— 不写这段，
//     publishToMavenLocal 永远 UP-TO-DATE、什么都不产出，JitPack 报
//     "No build artifacts found"（Build 却显示 SUCCESSFUL）。
//   * artifactId 必须显式写成 pinyinsearch：默认取项目名 pinyin_search（带下划线），
//     与仓库名对不上，JitPack 就认不出产物。
//   * group / version 见上方（group 从 -P 接收，version 取 mod_version，需与 tag 一致）。
//   * from components.java 会连带发布 -sources.jar / -javadoc.jar（见上方 java {}）。
// ============================================================
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'pinyinsearch'
            from components.java

            // ★ ForgeGradle 会把 `minecraft` 依赖解析出的 Forge / Minecraft 以及它的全部
            //   第三方库挂到 implementation 上，`from components.java` 便把它们统统写进发布的
            //   POM。依赖方（尤其是用 jarJar 的）会顺着传递依赖把这些全嵌进自己的 jar
            //   —— 体积爆炸，还和整合包里的版本打架。
            //   本库对外**不应声明任何 Maven 依赖**：MC / Forge 由运行环境提供，
            //   运行期关系由 mods.toml 声明。这里把 <dependencies> 整个删掉。
            pom.withXml {
                def root = asNode()
                root.dependencies.each { root.remove(it) }
            }
        }
    }
}

// jar 由 reobfJar 就地重映射（jar.finalizedBy('reobfJar')），而 finalizer 相对其它任务的
// 完成时机没有保证 —— 显式让发布任务排在 reobfJar 之后，
// 否则可能把未做 SRG 重映射的 jar 发出去（依赖方在正式环境加载时才炸）。
tasks.matching {
    it.name == 'publishMavenJavaPublicationToMavenLocal' ||
            it.name == 'publishMavenJavaPublicationToMavenRepository'
}.configureEach {
    dependsOn tasks.named('reobfJar')
}

// ★ 光清 POM 还不够：Gradle 默认还会额外发布一份 Gradle Module Metadata（*.module），
//   而 **Gradle 依赖方会优先读 .module、把 POM 丢在一边**。上面 pom.withXml 清掉的
//   Forge / MC 依赖会从 .module 里原样漏出去，等于白清。
//   本库的依赖信息用 POM 表达就够了，这里直接关掉 metadata 发布。
tasks.matching { it.name == 'generateMetadataFileForMavenJavaPublication' }.configureEach {
    enabled = false
}

tasks.named('javadoc', Javadoc).configure {
    source = sourceSets.main.allJava.matching {
        include '**/api/**'
        include '**/PinyinSearchMod.java'
    }.asFileTree

    // 中文 JavaDoc 必须显式指定编码与语言，否则乱码 / 导航栏是英文
    options.encoding = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.locale = 'zh_CN'
    options.windowTitle = "Pinyin Search API ${version}"
    options.header = "Pinyin Search API ${version}"
    options.links('https://docs.oracle.com/en/java/javase/17/docs/api/')
    // 不因为缺 @param 之类的 lint 让构建失败（公开 API 的 JavaDoc 完整性由 review 保证）
    options.addStringOption('Xdoclint:none', '-quiet')
    failOnError = false
}

// 把文档输出到仓库内的固定目录，方便本地直接打开查看（build/ 会被 clean 掉）
tasks.register('javadocToDocs', Copy) {
    group = 'documentation'
    description = '把 javadoc 输出复制到 docs/apidocs，供本地 / GitHub Pages 直接浏览'
    dependsOn tasks.named('javadoc')
    from tasks.named('javadoc').map { it.destinationDir }
    into layout.projectDirectory.dir('docs/apidocs')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
